<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS MX CORE | VERIFICACIÓN SOBERANA</title>
<style>
body{margin:0;background:#0a0a0a;color:#e5d3a3;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{max-width:520px;width:100%;border:2px solid #d4af37;background:#111;padding:30px;box-shadow:0 0 30px rgba(212,175,55,0.3)}
h1{color:#d4af37;text-align:center;letter-spacing:3px;margin:0 0 5px 0;font-size:22px}
.sub{text-align:center;color:#888;font-size:12px;letter-spacing:2px;margin-bottom:25px}
.estado{border:1px solid;padding:15px;text-align:center;margin:20px 0;font-weight:bold;letter-spacing:1px}
.verde{border-color:#00ff88;color:#00ff88;background:rgba(0,255,136,0.08)}
.rojo{border-color:#ff0040;color:#ff0040;background:rgba(255,0,64,0.08)}
.fila{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:8px 0;font-size:13px}
.fila span:last-child{color:#fff;word-break:break-all;text-align:right;max-width:60%}
a{color:#d4af37;text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
.hash{font-size:11px;color:#aaa;word-break:break-all;background:#000;padding:10px;margin:10px 0;border-left:3px solid #d4af37}
.btn{display:block;text-align:center;border:1px solid #d4af37;color:#d4af37;padding:10px;margin-top:15px;text-decoration:none}
.btn:hover{background:#d4af37;color:#000}
</style>
</head>
<body>
<div class="card">
<h1>KRONOS MX CORE</h1>
<div class="sub">TOLUCA HQ | LEGADO 2099 | B5 UNIFICADO</div>
<div id="resultado">Cargando verificación...</div>
</div>
<script>
async function verificar(){
const params = new URLSearchParams(window.location.search);
const id = params.get('id') || '7225862335';
const div = document.getElementById('resultado');
try{
const r = await fetch(`../citizens/${id}.json?nocache=${Date.now()}`);
if(!r.ok) throw new Error('ID NO ENCONTRADO');
const data = await r.json();
let html = '';
if(data.blockchain && data.blockchain.tx){
html += `<div class="estado verde">VERDE 0 = ACTIVO<br>ANCLADO EN ETHEREUM<br>${data.fvd || ''}</div>`;
}else{
html += `<div class="estado verde">VERDE 0 = ACTIVO<br>${data.fvd || ''}</div>`;
}
html += `<div class="fila"><span>ID FUNDACIONAL</span><span>${data.id}</span></div>`;
html += `<div class="fila"><span>RANGO</span><span>${data.rango}</span></div>`;
if(data.safe_creative) html += `<div class="fila"><span>SAFE CREATIVE</span><span>${data.safe_creative}</span></div>`;
if(data.blockchain){
html += `<div class="fila"><span>RED</span><span>${data.blockchain.red}</span></div>`;
html += `<div class="fila"><span>FECHA ANCLAJE</span><span>${data.blockchain.fecha_anclaje}</span></div>`;
html += `<div style="margin-top:15px;font-size:12px;color:#d4af37">SHA256 DE LA OBRA:</div><div class="hash">${data.blockchain.sha256_obra}</div>`;
html += `<div style="margin-top:15px;font-size:12px;color:#d4af37">TX ETHEREUM:</div><div class="hash"><a href="https://etherscan.io/tx/${data.blockchain.tx}" target="_blank">${data.blockchain.tx}</a></div>`;
html += `<a class="btn" href="https://etherscan.io/tx/${data.blockchain.tx}" target="_blank">VER EN ETHERSCAN</a>`;
html += `<a class="btn" href="${data.blockchain.verificacion}" target="_blank">VER CERTIFICADO SAFE CREATIVE</a>`;
}
html += `<div class="fila" style="margin-top:20px"><span>EMBAJADA</span><span><a href="${data.embajada || '../'}" target="_blank">kronos-mx-core/</a></span></div>`;
div.innerHTML = html;
}catch(e){
div.innerHTML = `<div class="estado rojo">ROJO 1 = NO ENCONTRADO<br>ID ${id} NO EXISTE EN REGISTRO</div><a class="btn" href="../">VOLVER</a>`;
}
}
verificar();
</script>
</body>
</html>
