# Instala liboqs (en Linux/Mac)
git clone https://github.com/open-quantum-safe/liboqs.git
cd liboqs
mkdir build && cd build
cmake .. && make && sudo make install

# Cifra un archivo con Kyber-1024
oqs_crypto_encrypt -k kyber1024 -i expediente.pdf -o expediente.pdf.enc
# Genera un par de llaves (pública y privada)
oqs_crypto_sign -k dilithium5 -g

# Firma un archivo
oqs_crypto_sign -k dilithium5 -s expediente.pdf -o expediente.pdf.sig

# Verifica la firma
oqs_crypto_sign -k dilithium5 -v expediente.pdf expediente.pdf.sig
# En tu archivo ~/.ssh/config
Host *
  KexAlgorithms sntrup761x25519-sha512@openssh.com
