name: B5 Deploy KRONOS MX CORE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build static
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "Static - no npm needed"; fi
          npm run build --if-present || echo "B5 OK"
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kronos-mx-core'
          slot-name: 'Development'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package:.
