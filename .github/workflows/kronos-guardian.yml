name: KRONOS-GUARDIAN SOBERANO
on:
  schedule:
    - cron: '0 9 * * *' # 1 vez al día 9am, no cada hora
  workflow_dispatch:

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Custodia Genesis Block
        run: |
          echo "KRONOS MX - GUARDIAN ACTIVO"
          echo "Bloque Genesis: 25692765"
          echo "Sede: Toluca - HECHO EN MEXICO - Hasta 2099"
          BLOCK=25692765
          echo "{\"genesis\":\"$BLOCK\",\"status\":\"OPERATIVO\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"soberania\":\"HECHO EN MEXICO\",\"hq\":\"Toluca\",\"valid_until\":\"2099\"}" > status.json
          cat status.json
