name: KRONOS Soberano Agent
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode:
    if: contains(github.event.comment.body, '/oc sovereign') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: opencode/github@main
        with:
          model: model_api/muse-spark-1.1
          agent: sovereign
          use_github_token: true
