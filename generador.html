<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS MX CORE - Generador Notario Global v2.2 - ID 7225862335</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#00ff88;padding:20px;max-width:900px;margin:auto}
.card{background:#111;border:1px solid #00ff88;padding:20px;border-radius:12px;margin-bottom:20px}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#000;color:#0f0}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
.qr{background:#fff;padding:10px;display:inline-block;border-radius:8px}
.badge{color:#000;background:#00ff88;padding:4px 8px;border-radius:4px;font-weight:bold}
</style>
</head>
<body>
<h1>🛡️ KRONOS MX CORE v2.2 <span class="badge">VERDE 0</span></h1>
<p>ID: 7225862335 | Toluca HQ | LEGADO 2099 | $2,000 MXN / KRMV</p>
<div class="card">
<h3>Generador KRMV Cobrable</h3>
<input id="nombre" placeholder="Nombre completo ciudadano">
<input id="curp" placeholder="CURP">
<input id="concepto" placeholder="Concepto / Tramite">
<input id="monto" type="number" value="2000">
<button onclick="generarKRMV()">GENERAR KRMV + QR CLABE</button>
</div>
<div class="card" id="resultado" style="display:none">
<h3 id="krmv_id"></h3>
<div id="qr" class="qr"></div>
<p>CLABE: <b>002438701524066473 - Banamex - Marco Antonio Rojas Valdovinos</b></p>
<p>Verificacion: <a id="verify_link" target="_blank"></a></p>
<pre id="json_output" style="background:#000;color:#0f0;padding:10px;overflow:auto"></pre>
<button onclick="descargarJSON()">Descargar KRMV JSON</button>
<button onclick="copiarSupabase()">Copiar INSERT Supabase</button>
</div>
<script>
const BASE_VERIFY = "https://kronosproyect.github.io/kronos-mx-core/verify/?id=";
let lastData = null;
function generarKRMV(){
  const nombre = document.getElementById('nombre').value.trim();
  const curp = document.getElementById('curp').value.trim().toUpperCase();
  const concepto = document.getElementById('concepto').value.trim();
  const monto = parseInt(document.getElementById('monto').value) || 2000;
  if(!nombre || !curp){ alert('Nombre y CURP requeridos'); return; }
  const ts = Date.now();
  const rand = Math.random().toString(36).substring(2,6).toUpperCase();
  const interaction_id = `KRONOS-${new Date().getFullYear()}-${ts.toString().slice(-6)}-${rand}`;
  const data = {
    interaction_id,
    id_ciudadano: curp,
    nombre,
    concepto,
    monto,
    moneda: "MXN",
    clabe_destino: "002438701524066473",
    banco: "Banamex",
    titular: "Marco Antonio Rojas Valdovinos",
    sede: "Toluca, Estado de Mexico",
    soberania: "HECHO EN MEXICO",
    genesis_block: 25692765,
    hq: "Toluca",
    valid_until: "2099",
    status: "PENDIENTE_PAGO",
    timestamp: new Date().toISOString(),
    verify_url: BASE_VERIFY + interaction_id,
    legado: "ID 7225862335 - VERDE 0"
  };
  lastData = data;
  document.getElementById('krmv_id').innerText = interaction_id;
  document.getElementById('verify_link').href = data.verify_url;
  document.getElementById('verify_link').innerText = data.verify_url;
  document.getElementById('json_output').innerText = JSON.stringify(data, null, 2);
  document.getElementById('qr').innerHTML = "";
  new QRCode(document.getElementById('qr'), {text: data.verify_url, width:180, height:180});
  document.getElementById('resultado').style.display = "block";
}
function descargarJSON(){
  if(!lastData) return;
  const blob = new Blob([JSON.stringify(lastData,null,2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lastData.interaction_id + ".json";
  a.click();
}
function copiarSupabase(){
  if(!lastData) return;
  const sql = `INSERT INTO krmv (interaction_id, curp, nombre, concepto, monto, status, genesis_block, verify_url, payload) VALUES ('${lastData.interaction_id}', '${lastData.id_ciudadano}', '${lastData.nombre.replace(/'/g,"''")}', '${lastData.concepto.replace(/'/g,"''")}', ${lastData.monto}, '${lastData.status}', ${lastData.genesis_block}, '${lastData.verify_url}', '${JSON.stringify(lastData).replace(/'/g,"''")}'::jsonb) ON CONFLICT (interaction_id) DO NOTHING;`;
  navigator.clipboard.writeText(sql).then(()=>alert('INSERT copiado - pega en Supabase'));
}
</script>
</body>
</html>
