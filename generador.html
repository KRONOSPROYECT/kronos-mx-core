<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador KRMV | KRONOS MX CORE v2.1 - ID 7225862335</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--gold:#C9A86A;--black:#0A0A0A;--card:#111114;--green:#00FF88;--red:#FF4444}
*{box-sizing:border-box} body{background:var(--black);color:#fff;font-family:Inter,system-ui;padding:18px;margin:0}
.box{max-width:560px;margin:auto;border:1px solid var(--gold);padding:22px;background:var(--card);border-radius:12px}
h2{color:var(--gold);letter-spacing:3px;margin:0 0 4px;font-size:18px}
.sub{font-size:10px;letter-spacing:2px;opacity:.6;margin-bottom:16px}
label{font-size:9px;letter-spacing:2px;color:var(--gold);margin:12px 0 4px;display:block}
input{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:6px}
button{width:100%;padding:13px;margin:10px 0 0;background:var(--gold);color:#000;border:none;font-weight:800;letter-spacing:2px;border-radius:8px;cursor:pointer}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.res{margin-top:16px;padding:14px;border:1px solid #222;background:#000;font-size:12px;line-height:1.6}
.verde{color:var(--green);font-weight:700} .rojo{color:var(--red);font-weight:700}
.qr{width:130px;height:130px;background:#fff;margin:12px auto;display:flex;align-items:center;justify-content:center}
.hash{font-family:monospace;font-size:8px;word-break:break-all;color:#0f0;margin-top:8px;background:#050505;padding:8px;border:1px solid #222}
a{color:var(--gold)}
</style></head>
<body><div class="box">
<h2>GENERADOR KRMV v2.1</h2>
<div class="sub">ID 7225862335 | Protocolo 2608096674952 | TX 0x7ef5...95a2 | KRMV-(MARCA)-0000001</div>

<label>MARCA (ej: KRONOS, NIKE, TOLUCA)</label>
<input id="marca" value="KRONOS" placeholder="MARCA">

<label>TITULAR / PERSONA / LOTE</label>
<input id="titular" placeholder="Ej: Juan Pérez o Lote Textil A1">

<label>FABRICANTE / ORIGEN</label>
<input id="fabricante" value="Kronos MX Core - ID 7225862335 - Toluca HQ">

<label>EMISIÓN</label>
<input id="emision" type="date">

<label>CADUCIDAD / VIGENCIA</label>
<input id="caducidad" type="date">

<label>CORRELATIVO (7 dígitos - automático)</label>
<input id="corr" type="number" value="1">

<button onclick="generar()">GENERAR KRMV + HASH + QR</button>
<button class="ghost" onclick="descargar()">DESCARGAR JSON</button>

<div id="res" class="res" style="display:none"></div>
</div>

<script>
document.getElementById('emision').valueAsDate = new Date();
let n=new Date(); n.setFullYear(n.getFullYear()+1);
document.getElementById('caducidad').valueAsDate = n;
document.getElementById('corr').value = localStorage.getItem('krmv_count')||1;

let lastData=null, lastHash=null;

async function generar(){
  const marca = document.getElementById('marca').value.toUpperCase().replace(/[^A-Z0-9]/g,'')||'KRONOS';
  const titular = document.getElementById('titular').value.trim()||'Titular Privado';
  const fabricante = document.getElementById('fabricante').value.trim();
  const emision = document.getElementById('emision').value;
  const caducidad = document.getElementById('caducidad').value;
  const corrNum = document.getElementById('corr').value;
  const folio = `KRMV-${marca}-${String(corrNum).padStart(7,'0')}`;

  const payload = {
    folio, marca, titular, fabricante, emision, caducidad,
    estado:0, estado_txt:"VERDE 0 = ACTIVO",
    id_fundacional:"7225862335",
    protocolo_base:"2608096674952",
    tx_base:"0x7ef5dbd264e100de9cbf639b2e5a0df10ab5c62769d2f2c49cae51b4e8e995a2",
    bloques:["2607086319439","2607146379465","2608056639878","2608096674952"],
    version:"KRMV v2.1"
  };

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(payload)));
  const hash = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');

  lastData=payload; lastHash=hash;

  const res=document.getElementById('res');
  res.style.display='block';
  res.innerHTML=`
    <div class="verde">● VERDE 0 = ACTIVO — ${folio}</div>
    <p><b>Marca:</b> ${marca}<br><b>Titular:</b> ${titular}<br><b>Fabricante:</b> ${fabricante}<br>
    <b>Emisión:</b> ${emision} | <b>Vigencia:</b> ${caducidad}</p>
    <div id="qr" class="qr"></div>
    <div class="hash">Folio: ${folio}<br>Hash SHA256: ${hash}<br><br>Guarda como: citizens/${folio}.json<br>Agrega a registry.json:<br>{"folio":"${folio}","hash":"${hash}","titular":"${titular}","caducidad":"${caducidad}","estado":0}</div>
    <p><a href="verify/?id=${folio}" target="_blank">→ Verificar en /verify/?id=${folio}</a></p>
    <p style="font-size:9px;opacity:.5">Documento privado sin validez oficial gubernamental. Verificación en /verify/ + Etherscan.</p>
  `;
  
  document.getElementById('qr').innerHTML='';
  new QRCode(document.getElementById('qr'), {text:`${location.origin}/verify/?id=${folio}&h=${hash.slice(0,16)}`, width:120, height:120});

  localStorage.setItem('krmv_count', parseInt(corrNum)+1);
  document.getElementById('corr').value = parseInt(corrNum)+1;
}

function descargar(){
  if(!lastData) return alert('Primero genera');
  const blob=new Blob([JSON.stringify({...lastData, hash:lastHash}, null, 2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${lastData.folio}.json`; a.click();
}
</script></body></html>
